[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dingyue"
version = "0.1.0"
description = "订阅 · 账单体检 · 识别、年化、重复检测、砍单顺序"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
dingyue = "dingyue.cli:main"

[tool.setuptools]
packages = ["dingyue"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
